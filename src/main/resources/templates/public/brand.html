<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${brandItem.name} + ' | Kim Thành Phát'">Thương hiệu sản phẩm | Kim Thành Phát</title>
    <meta name="description" th:content="${'Khám phá thiết bị PCCC thương hiệu ' + brandItem.name + ' tại Kim Thành Phát. Tư vấn và báo giá theo nhu cầu công trình.'}">
    <link rel="canonical" th:href="${'https://kimthanhphatpccc.vn/' + brandItem.slug}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/sidebar.css}" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/product-pages.css}" rel="stylesheet">
</head>
<body class="products-page">
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main th:replace="~{fragments/catalog-results :: catalogResults('Thương hiệu thiết bị', ${brandItem.name}, 'Danh sách thiết bị theo thương hiệu, trình bày rõ thông tin để thuận tiện so sánh.', ${brandItem.slug})}"></main>
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
