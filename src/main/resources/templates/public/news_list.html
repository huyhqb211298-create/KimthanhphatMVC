<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin tức PCCC | Kim Thành Phát</title>

    <!-- CSS & Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background: #f5f6fa;
        }

        /* Divider line */
        .section-divider {
            height: 1px;
            background: #e4e4e4;
            margin: 35px 0;
        }

        /* Mini product card */
        .mini-product-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.25s;
        }
        .mini-product-card:hover {
            transform: translateY(-4px);
        }
        .mini-product-img {
            height: 120px;
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-weight: 600;
        }

        .contact-btn-small {
            padding: 3px 10px;
            background: #d32f2f;
            color: white;
            border-radius: 6px;
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .contact-btn-small:hover {
            background: #b71c1c;
        }

        /* Featured big article */
        .featured-box {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            padding: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        .featured-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        /* Tiny news (right side) */
        .tiny-news-card {
            background: white;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.25s;
        }
        .tiny-news-card:hover {
            transform: translateY(-4px);
        }
        .tiny-thumb {
            width: 130px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        /* List articles */
        .news-card {
            background: white;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.25s;
        }
        .news-card:hover {
            transform: translateY(-4px);
        }



        .read-more-btn:hover {
            background: #b71c1c;
            transform: translateX(3px);
        }

        .load-more-btn {
            padding: 10px 24px;
            background: #d32f2f;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            border: none;
        }

        /* Remove underline & keep colors for clickable cards */
        .featured-box, .tiny-news-card, .news-card {
            text-decoration: none !important;
            color: #000 !important;
        }
        .featured-box h3, .tiny-news-card h6, .news-card h5 {
            color: #000 !important;
        }

    </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<div class="container py-5">

    <!-- TITLE -->
    <h1 class="fw-bold mb-4 text-danger text-uppercase text-center">
        Tin tức phòng cháy chữa cháy
    </h1>

    <!-- MINI PRODUCT CARDS -->
    <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">
            <div class="mini-product-card">
                <img src="/img/pro-victory-f4.jpg" class="mini-product-img">
                <div class="product-info">
                    <span>Bình chữa cháy F4</span>
                    <a href="https://zalo.me/0934752114" class="contact-btn-small">Liên hệ</a>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="mini-product-card">
                <img src="/img/pro-mt3-co2.jpg" class="mini-product-img">
                <div class="product-info">
                    <span>Bình CO2 MT3</span>
                    <a href="https://zalo.me/0934752114" class="contact-btn-small">Liên hệ</a>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="mini-product-card">
                <img src="/img/pro-fm200.jpg" class="mini-product-img">
                <div class="product-info">
                    <span>Hệ thống chữa cháy khí FM200</span>
                    <a href="https://zalo.me/0934752114" class="contact-btn-small">Liên hệ</a>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="mini-product-card">
                <img src="/img/sprinkler.jpg" class="mini-product-img">
                <div class="product-info">
                    <span>Đầu phun sprinkler</span>
                    <a href="https://zalo.me/0934752114" class="contact-btn-small">Liên hệ</a>
                </div>
            </div>
        </div>

    </div>

    <div class="section-divider"></div>

    <!-- FEATURED + RIGHT NEWS -->
    <div class="row g-4 mb-5 align-items-stretch">

        <!-- BIG FEATURED -->
        <div class="col-md-7 d-flex">
            <a th:href="@{'/news/' + ${featured.slug}}"
               th:if="${featured != null}"
               class="featured-box d-flex flex-column flex-fill text-decoration-none text-dark">

                <img th:src="${featured.thumbnail}" class="featured-img">

                <div class="p-3 d-flex flex-column flex-grow-1">
                    <div>
                        <h3 class="fw-bold" th:text="${featured.title}"></h3>
                        <small class="text-muted">
                            <i class="fa fa-calendar"></i>
                            <span th:text="${#temporals.format(featured.createdAt,'dd/MM/yyyy')}"></span>
                        </small>
                    </div>

                    <p class="mt-2 text-secondary flex-grow-1" th:text="${featured.summary}"></p>


                </div>

            </a>
        </div>

        <!-- RIGHT 4 SMALL NEWS -->
        <div class="col-md-5 d-flex">
            <div class="d-flex flex-column justify-content-between flex-fill">
                <a th:href="@{'/news/' + ${n.slug}}"
                   class="tiny-news-card text-decoration-none text-dark"
                   th:each="n,i : ${others}"
                   th:if="${i.index < 4}">

                    <img th:src="${n.thumbnail}" class="tiny-thumb">

                    <div>
                        <h6 class="fw-bold mb-1" th:text="${n.title}"></h6>
                        <small class="text-muted">
                            <i class="fa fa-calendar"></i>
                            <span th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy')}"></span>
                        </small>
                    </div>
                </a>
            </div>
        </div>

    </div>

    <div class="section-divider"></div>

    <!-- LIST 5 ARTICLES -->
    <h4 class="fw-bold mb-3 text-danger">Các tin tiếp theo</h4>

    <div id="news-list">
        <a class="news-card mb-3 text-decoration-none text-dark d-block"
           th:each="n,i : ${others}"
           th:if="${i.index >= 4 && i.index < 9}"
           th:href="@{'/news/' + ${n.slug}}">

            <div class="d-flex gap-3">
                <img th:src="${n.thumbnail}" style="width:140px;height:100px;object-fit:cover;border-radius:6px;">
                <div>
                    <h5 th:text="${n.title}" class="fw-bold mb-1"></h5>
                    <small class="text-muted">
                        <i class="fa fa-calendar"></i>
                        <span th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy')}"></span>
                    </small>
                    <p class="text-secondary" th:text="${n.summary}"></p>
                </div>
            </div>

        </a>
    </div>

    <!-- LOAD MORE -->
    <div class="text-center mt-4">
        <button class="load-more-btn" id="loadMoreBtn">Xem thêm 10 bài</button>
    </div>

</div>

<!-- FOOTER -->
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

<script>
    let loaded = 9;
    document.getElementById("loadMoreBtn").onclick = function () {
        loaded += 10;
        window.location.href = "/news?page=0&load=" + loaded;
    }
</script>

</body>
</html>
