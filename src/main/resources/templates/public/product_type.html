<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${productType.name} + ' - Loại sản phẩm'">Loại sản phẩm</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/sidebar.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <!-- HERO SOFT STYLE -->
    <style>
        .hero-soft {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            margin-top: 25px;
            margin-bottom: 40px;
            padding: 55px 20px;
            text-align: center;

            background: linear-gradient(135deg, rgba(255,120,80,0.22), rgba(255,210,190,0.22));
            border-radius: 22px;
            border: 1px solid rgba(255,120,80,0.26);

            backdrop-filter: blur(6px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }

        .hero-soft h1 {
            font-size: 38px;
            font-weight: 700;
            color: #d64535;
        }

        .hero-soft p {
            font-size: 16px;
            margin-top: 6px;
            color: #555;
            opacity: .85;
        }

        /* Product Card */
        .product-card {
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: .25s ease;
            border: 1px solid #eee;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            font-size: 15px;
            font-weight: 700;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #222;
        }

        .product-meta {
            font-size: 13px;
            color: #777;
        }

        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: #c8102e;
        }
    </style>

</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="flex-grow-1">

    <!-- HERO – đồng bộ giao diện -->
    <div class="hero-soft">
        <h1 th:text="${productType.name}"></h1>
        <p>Danh sách sản phẩm thuộc loại này</p>
    </div>

    <div class="container py-4">

        <div class="row">

            <!-- SIDEBAR: dùng fragment chung -->
            <div class="col-lg-3 mb-4">
                <div th:replace="~{fragments/sidebar :: sidebar(
                    categories=${categories},
                    brandList=${brandList},
                    productTypeList=${productTypeList}
                )}"></div>
            </div>

            <!-- PRODUCT GRID -->
            <div class="col-lg-9">
                <!-- FILTER BAR -->
                <form th:action="@{/products}" method="get">
                    <div th:replace="~{fragments/filter :: filter(
                        categories=${categories},
                        brands=${brands},
                        productTypes=${productTypes},
                        selectedCategory=${selectedCategory},
                        selectedBrand=${selectedBrand},
                        selectedType=${selectedProductType},
                        keyword=${keyword}
                    )}"></div>
                </form>
                <div class="row g-4">

                    <div class="col-md-4" th:each="p : ${products}">
                        <div class="product-card"
                             th:onclick="'window.location.href=\'' + @{/{slug}(slug=${p.slug})} + '\';'">

                            <img th:src="${#strings.isEmpty(p.image) ? '/img/no-image.jpg' : p.image}"
                                 th:alt="${p.name}">

                            <div class="p-3">

                                <div class="product-name" th:text="${p.name}"></div>

                                <div class="product-meta mb-2">
                                    <span th:text="${p.brand?.name}"></span> |
                                    <span th:text="${p.category?.name}"></span>
                                </div>

                                <div class="product-price"
                                     th:if="${p.priceDisplay?.name() == 'SHOW'}"
                                     th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' ₫'"></div>

                                <div th:if="${p.priceDisplay?.name() == 'CONTACT'}"
                                     class="text-muted fst-italic">Liên hệ</div>

                                <a th:href="@{/{slug}(slug=${p.slug})}"
                                   class="btn btn-outline-danger btn-sm mt-3">Xem chi tiết</a>

                            </div>
                        </div>
                    </div>

                    <!-- EMPTY STATE -->
                    <div th:if="${#lists.isEmpty(products)}"
                         class="text-center text-muted mt-5">
                        Hiện chưa có sản phẩm trong loại này.
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

<!-- FOOTER -->
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

<script th:src="@{/js/sidebar.js}"></script>

</body>
</html>
