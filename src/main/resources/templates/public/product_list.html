<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm PCCC</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/sidebar.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>
        .product-card {
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: .25s ease;
            border: 1px solid #eee;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            font-size: 15px;
            font-weight: 700;
            min-height: 40px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="flex-grow-1">

    <!-- HERO -->
    <div class="mt-4 mb-4">
        <div th:replace="~{fragments/hero :: hero(
            'Danh sách sản phẩm',
            'Tất cả sản phẩm hiện có tại Kim Thành Phát'
        )}"></div>
    </div>

    <div class="container py-4">

        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-lg-3 mb-4">
                <div th:replace="~{fragments/sidebar :: sidebar(
                    categories=${categories},
                    brandList=${brands},
                    productTypeList=${productTypes}
                )}"></div>
            </div>

            <!-- PRODUCT LIST -->
            <div class="col-lg-9">

                <!-- FILTER BAR -->
                <form th:action="@{/products}" method="get">
                    <div th:replace="~{fragments/filter :: filter(
                        categories=${categories},
                        brands=${brands},
                        productTypes=${productTypes},
                        selectedCategory=${selectedCategory},
                        selectedBrand=${selectedBrand},
                        selectedType=${selectedProductType},
                        keyword=${keyword}
                    )}"></div>
                </form>

                <!-- PRODUCT GRID -->
                <div class="row g-4 mt-2">
                    <div class="col-md-4" th:each="p : ${products}">
                        <div class="product-card"
                             th:onclick="'window.location.href=\'' + @{/products/{slug}(slug=${p.slug})} + '\';'">

                            <img th:src="${#strings.isEmpty(p.image) ? '/img/no-image.jpg' : p.image}"
                                 th:alt="${p.name}">

                            <div class="p-3">
                                <div class="product-name" th:text="${p.name}"></div>

                                <div class="product-meta mb-2">
                                    <span th:text="${p.brand?.name}"></span> |
                                    <span th:text="${p.category?.name}"></span>
                                </div>

                                <div th:if="${p.priceDisplay?.name() == 'SHOW'}"
                                     class="product-price"
                                     th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' ₫'"></div>

                                <div th:if="${p.priceDisplay?.name() == 'CONTACT'}"
                                     class="text-muted fst-italic">Liên hệ</div>

                                <a th:href="@{/products/{slug}(slug=${p.slug})}"
                                   class="btn btn-outline-danger btn-sm mt-3">Xem chi tiết</a>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</main>

<!-- FOOTER -->
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/js/waypoints.min.js}"></script>
<script th:src="@{/js/counterup.min.js}"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
