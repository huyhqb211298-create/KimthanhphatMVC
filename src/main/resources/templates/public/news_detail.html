<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${news.title} + ' | Kim Thành Phát'">Tin tức | Kim Thành Phát</title>
    <meta name="description" th:content="${#strings.isEmpty(news.summary) ? news.plainContent : news.summary}">
    <link rel="canonical" th:href="@{'https://kimthanhphatpccc.vn/news/' + ${news.slug}}">
    <meta property="og:type" content="article">
    <meta property="og:title" th:content="${news.title}">
    <meta property="og:description" th:content="${#strings.isEmpty(news.summary) ? news.plainContent : news.summary}">
    <meta property="og:image" th:content="${#strings.isEmpty(news.thumbnail) ? 'https://kimthanhphatpccc.vn/img/about-banner.jpg' : news.thumbnail}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/header.css}" rel="stylesheet">
    <link th:href="@{/css/news.css}" rel="stylesheet">
</head>
<body class="news-page">
<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>
    <header class="article-hero">
        <div class="news-shell">
            <nav class="article-breadcrumb" aria-label="Đường dẫn">
                <a th:href="@{/}">Trang chủ</a><span>/</span>
                <a th:href="@{/news}">Tin tức</a><span>/</span>
                <span th:text="${news.title}"></span>
            </nav>
            <p class="news-eyebrow">Kiến thức PCCC</p>
            <h1 th:text="${news.title}"></h1>
            <span class="news-date"><i class="fa-regular fa-calendar"></i><span th:text="${#temporals.format(news.createdAt, 'dd/MM/yyyy')}"></span></span>
        </div>
    </header>

    <div class="news-shell article-layout">
        <article class="article-main">
            <img class="article-main-image"
                 th:src="${#strings.isEmpty(news.thumbnail) ? '/img/about-banner.jpg' : news.thumbnail}"
                 th:alt="${news.title}" fetchpriority="high" decoding="async">
            <div class="article-content" th:utext="${news.content}"></div>
        </article>

        <aside class="article-sidebar">
            <section class="latest-panel">
                <h2>Tin mới nhất</h2>
                <a class="latest-item" th:each="item, stat : ${latest}" th:if="${stat.index < 5}" th:href="@{'/news/' + ${item.slug}}">
                    <img th:src="${#strings.isEmpty(item.thumbnail) ? '/img/about-company.jpg' : item.thumbnail}" th:alt="${item.title}" loading="lazy">
                    <div>
                        <span class="news-date"><i class="fa-regular fa-calendar"></i><span th:text="${#temporals.format(item.createdAt,'dd/MM')}"></span></span>
                        <h3 th:text="${item.title}"></h3>
                    </div>
                </a>
            </section>

            <section class="article-contact">
                <h2>Cần hỗ trợ về PCCC?</h2>
                <p>Gửi thông tin công trình để chúng tôi trao đổi thiết bị và phương án phù hợp.</p>
                <a th:href="@{/contact}">Liên hệ ngay <i class="fa-solid fa-arrow-right ms-2"></i></a>
            </section>
        </aside>
    </div>

    <section class="related-news" th:if="${related != null and !related.isEmpty()}">
        <div class="news-shell">
            <p class="news-eyebrow">Đọc thêm</p>
            <h2>Bài viết liên quan</h2>
            <div class="news-grid">
                <a class="news-card" th:each="item, stat : ${related}" th:if="${stat.index < 3}" th:href="@{'/news/' + ${item.slug}}">
                    <div class="news-card-media">
                        <img th:src="${#strings.isEmpty(item.thumbnail) ? '/img/about-pccc-2.jpg' : item.thumbnail}" th:alt="${item.title}" loading="lazy">
                        <span>Kiến thức PCCC</span>
                    </div>
                    <div class="news-card-copy">
                        <span class="news-date"><i class="fa-regular fa-calendar"></i><span th:text="${#temporals.format(item.createdAt,'dd/MM/yyyy')}"></span></span>
                        <h3 th:text="${item.title}"></h3>
                        <p th:if="${!#strings.isEmpty(item.summary)}" th:text="${item.summary}"></p>
                        <span class="news-more">Đọc bài viết <i class="fa-solid fa-arrow-right"></i></span>
                    </div>
                </a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
