<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link th:href="@{/img/favicon.ico}" rel="icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css}" rel="stylesheet">

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<style>
    .product-main-image {
        width: 100%;
        height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
        overflow: hidden;
        border-radius: 12px;
    }

    .product-main-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .product-main-image:hover img {
        transform: scale(1.05);
    }

    .product-card {
        border-radius: 0.75rem;
        background-color: #fff;
        transition: all 0.3s ease;
    }

    .product-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    .product-card img {
        border-top-left-radius: 0.75rem;
        border-top-right-radius: 0.75rem;
        transition: transform 0.3s ease;
    }

    .product-card:hover img {
        transform: scale(1.05);
    }

    section.container {
        background-color: #fafafa;
        border-radius: 10px;
        padding: 40px;
    }

    /* BREADCRUMB NEW STYLE (same as news_detail) */
    .breadcrumb-custom {
        font-size: 15px;
        margin-bottom: 20px;
    }

    .breadcrumb-custom a {
        color: #d32f2f;
        font-weight: 600;
        text-decoration: none;
    }

    .breadcrumb-custom a:hover {
        text-decoration: underline;
    }

    .breadcrumb-custom span {
        color: #888;
        margin: 0 6px;
    }

    .breadcrumb-custom span:last-child {
        color: #000;
        font-weight: 600;
    }

</style>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<!-- MAIN -->
<section class="container py-5" style="min-height: 80vh;">
    <div class="row g-5 align-items-start">

        <!-- BREADCRUMB (NEW STYLE LIKE NEWS DETAIL) -->
        <nav class="breadcrumb-custom">
            <a th:href="@{/}">Trang chủ</a>
            <span>/</span>

            <a th:href="@{'/' + ${product.category.slug}}"
               th:text="${product.category.name}"></a>

            <span>/</span>

            <span th:text="${product.name}"></span>
        </nav>

        <!-- Image -->
        <div class="col-md-5">
            <div class="product-main-image shadow-sm bg-white border">
                <img th:src="${#strings.isEmpty(product.image) ? '/img/no-image.jpg' : product.image}"
                     th:alt="${product.name}">
            </div>
        </div>

        <!-- Information -->
        <div class="col-md-7">
            <h2 class="fw-bold mb-3 text-danger" th:text="${product.name}"></h2>

            <div class="mb-3">
                <span class="badge bg-danger" th:if="${product.stockStatus?.name() == 'IN_STOCK'}">Còn hàng</span>
                <span class="badge bg-secondary" th:if="${product.stockStatus?.name() == 'OUT_OF_STOCK'}">Hết hàng</span>
                <span class="badge bg-warning text-dark" th:text="${product.category?.name}"></span>
            </div>

            <p class="lead fw-bold text-danger"
               th:if="${product.priceDisplay?.name() == 'SHOW'}"
               th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></p>

            <p th:if="${product.priceDisplay?.name() == 'CONTACT'}"
               class="lead text-muted fst-italic">Liên hệ để báo giá</p>

            <p><strong>Thương hiệu:</strong> <span th:text="${product.brand?.name}"></span></p>
            <p><strong>Xuất xứ:</strong> <span th:text="${product.origin}"></span></p>
            <p><strong>Bảo hành:</strong> <span th:text="${product.warrantyMonths + ' tháng'}"></span></p>

            <div class="d-flex gap-3 mb-4">
                <a href="#" class="btn btn-danger px-4">Liên hệ mua hàng</a>
                <a th:href="@{/products}" class="btn btn-outline-secondary px-4">← Quay lại danh sách</a>
            </div>
        </div>
    </div>

    <!-- Description -->
    <div class="row mt-5">
        <div class="col-lg-12">
            <h4 class="border-bottom border-danger pb-2 mb-3 text-uppercase">Mô tả sản phẩm</h4>
            <p th:utext="${product.description}" class="text-secondary lh-lg"></p>
        </div>
    </div>

    <!-- Related products -->
    <div class="row mt-5">
        <h4 class="border-bottom border-danger pb-2 mb-4 text-uppercase">Sản phẩm cùng loại</h4>

        <div class="col-md-3 mb-4" th:each="rel : ${relatedProducts}">
            <div class="card h-100 border-0 shadow-sm product-card">

                <img th:src="${#strings.isEmpty(rel.image) ? '/img/no-image.jpg' : rel.image}"
                     th:alt="${rel.name}"
                     class="card-img-top"
                     style="height: 200px; object-fit: cover;">

                <div class="card-body text-center">
                    <h6 class="fw-semibold text-truncate" th:text="${rel.name}"></h6>

                    <p class="text-danger fw-bold small"
                       th:if="${rel.priceDisplay?.name() == 'SHOW'}"
                       th:text="${#numbers.formatDecimal(rel.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></p>

                    <p class="text-muted small fst-italic"
                       th:if="${rel.priceDisplay?.name() == 'CONTACT'}">Liên hệ</p>

                    <a th:href="@{/{slug}(slug=${rel.slug})}" class="btn btn-outline-danger btn-sm">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

</body>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/counterup/counterup.min.js}"></script
