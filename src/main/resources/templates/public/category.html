<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${category.name} + ' - Danh mục sản phẩm'">Danh mục sản phẩm</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/sidebar.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>
        .hero-soft {
            max-width:1300px;margin:25px auto;padding:50px 20px;text-align:center;
            background:linear-gradient(135deg, rgba(255,120,80,0.22), rgba(255,210,190,0.22));
            border-radius:22px;
            border:1px solid rgba(255,120,80,0.26);
        }
        .product-card { border-radius:16px; overflow:hidden; border:1px solid #eee; cursor:pointer; transition:.25s; }
        .product-card:hover { transform:translateY(-6px); }
        .product-card img { width:100%; height:220px; object-fit:cover; }

        .pagination .page-link { color:#d62828; border-radius:8px; border-color:#ffcfcf; }
        .pagination .active .page-link { background:#d62828; color:white; }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>

    <div class="hero-soft">
        <h1 th:text="${category.name}"></h1>
        <p>Danh sách sản phẩm thuộc danh mục này</p>
    </div>

    <div class="container py-4">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-lg-3">
                <div th:replace="~{fragments/sidebar :: sidebar(
                    categories=${categories},
                    brandList=${brandList},
                    productTypeList=${productTypeList}
                )}"></div>
            </div>

            <div class="col-lg-9">

                <!-- FILTER BAR -->
                <form th:action="@{/products}" method="get">
                    <div th:replace="~{fragments/filter :: filter(
                        categories=${categories},
                        brands=${brandList},
                        productTypes=${productTypeList},
                        selectedCategory=${selectedCategory},
                        selectedBrand=${selectedBrand},
                        selectedType=${selectedType},
                        keyword=${keyword}
                    )}"></div>
                </form>

                <!-- PRODUCT GRID -->
                <div class="row g-4">

                    <div class="col-md-4" th:each="p : ${products}">
                        <div class="product-card"
                             th:onclick="'window.location.href=\'' + @{/{slug}(slug=${p.slug})} + '\';'">
                            <img th:src="${#strings.isEmpty(p.image)?'/img/no-image.jpg':p.image}" />
                            <div class="p-3">

                                <div class="fw-bold" th:text="${p.name}"></div>

                                <div class="text-muted small">
                                    <span th:text="${p.brand?.name}"></span> |
                                    <span th:text="${p.category?.name}"></span>
                                </div>

                                <div th:if="${p.priceDisplay?.name()=='SHOW'}"
                                     class="fw-bold text-danger"
                                     th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' ₫'"></div>

                                <a th:href="@{/{slug}(slug=${p.slug})}"
                                   class="btn btn-outline-danger btn-sm mt-2">Xem chi tiết</a>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- PAGINATION -->
                <div class="mt-4 d-flex justify-content-center" th:if="${totalPages>1}">
                    <ul class="pagination">

                        <li class="page-item" th:classappend="${currentPage == 1}? 'disabled'">
                            <a class="page-link"
                               th:href="@{/{slug}(slug=${category.slug}, page=${currentPage-1})}">
                                ← Trước
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(1,totalPages)}"
                            th:classappend="${i==currentPage}? 'active'">
                            <a class="page-link"
                               th:href="@{/{slug}(slug=${category.slug}, page=${i})}"
                               th:text="${i}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages}? 'disabled'">
                            <a class="page-link"
                               th:href="@{/{slug}(slug=${category.slug}, page=${currentPage+1})}">
                                Sau →
                            </a>
                        </li>

                    </ul>
                </div>

            </div>

        </div>
    </div>

</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>

</body>
</html>
