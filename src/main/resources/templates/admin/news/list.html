<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tin tức</title>

    <!-- FontAwesome + Custom CSS + Bootstrap -->
    <link rel="stylesheet" th:href="@{/lib/fontawesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📄 Danh sách tin tức</h3>
        <a th:href="@{/admin/news/new}" class="btn btn-primary">
            <i class="fa fa-plus"></i> Thêm tin tức
        </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

    <!-- TABLE -->
    <table class="table table-bordered align-middle">
        <thead class="table-light text-center">
        <tr>
            <th width="70">ID</th>
            <th width="120">Thumbnail</th>
            <th>Tiêu đề</th>
            <th>Slug</th>
            <th width="260">Tóm tắt</th>
            <th width="120">Trạng thái</th>
            <th width="160">Ngày tạo</th>
            <th style="width:150px;">Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="n : ${list}">
            <td th:text="${n.id}"></td>

            <td class="text-center">
                <img th:src="${n.thumbnail}" style="width: 90px; border-radius: 6px;">
            </td>

            <td th:text="${n.title}"></td>
            <td th:text="${n.slug}"></td>

            <!-- SUMMARY -->
            <td th:text="${n.summary != null ? (n.summary.length() > 60 ? n.summary.substring(0, 60) + '…' : n.summary) : ''}">
            </td>

            <td class="text-center">
                <span th:if="${n.active}" class="badge bg-success">Hiển thị</span>
                <span th:unless="${n.active}" class="badge bg-secondary">Ẩn</span>
            </td>

            <td th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></td>

            <td class="text-center">
                <a th:href="@{'/admin/news/edit/' + ${n.id}}" class="btn btn-sm btn-warning">
                    <i class="fa fa-edit"></i> Sửa
                </a>

                <a th:href="@{'/admin/news/delete/' + ${n.id}}"
                   onclick="return confirm('Bạn chắc chắn muốn xóa tin này?');"
                   class="btn btn-sm btn-danger mt-1">
                    <i class="fa fa-trash"></i> Xóa
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(list)}">
            <td colspan="8" class="text-center text-muted py-3">
                Không có tin tức nào.
            </td>
        </tr>
        </tbody>
    </table>


</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
