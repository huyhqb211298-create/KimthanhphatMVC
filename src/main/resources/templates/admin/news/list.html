<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tin tức</title>

    <!-- FontAwesome + Custom CSS + Bootstrap -->
    <link rel="stylesheet" th:href="@{/lib/fontawesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        .nav-admin {
            font-weight: 500;
            font-size: 15px;
            padding-bottom: 3px;
            border-bottom: 2px solid transparent;
            transition: 0.25s ease;
        }

        .nav-admin:hover {
            color: #ff9800 !important;
            border-bottom: 2px solid #ff9800;
        }

        /* Highlight tab đang active (auto theo URL) */
        .nav-admin.active {
            color: #ff9800 !important;
            border-bottom: 2px solid #ff9800;
        }
    </style>
</head>

<body>
<!-- NAVBAR ADMIN (ĐẸP – HIỆN ĐẠI) -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm"
     style="background: linear-gradient(90deg, #1f1f1f, #2c2c2c); padding: 14px 32px;">

    <!-- Logo -->
    <a class="navbar-brand fw-bold d-flex align-items-center" href="/admin"
       style="font-size: 20px;">
        <i class="fa-solid fa-shield-halved me-2" style="color:#ff9800;"></i>
        Quản trị hệ thống
    </a>

    <!-- Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminMenu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div id="adminMenu" class="collapse navbar-collapse">

        <!-- Menu trái -->
        <ul class="navbar-nav ms-4">
            <li class="nav-item me-3">
                <a class="nav-link nav-admin" href="/admin/products">
                    <i class="fa-solid fa-box me-1"></i> Sản phẩm
                </a>
            </li>

            <li class="nav-item me-3">
                <a class="nav-link nav-admin" href="/admin/news">
                    <i class="fa-solid fa-newspaper me-1"></i> Tin tức
                </a>
            </li>
        </ul>

        <!-- Menu phải -->
        <div class="ms-auto d-flex align-items-center">

            <span class="me-3 text-light opacity-75" style="font-size: 14px;">
                <i class="fa-solid fa-user-shield me-1"></i> Admin đang đăng nhập
            </span>

            <a href="/logout" class="btn btn-danger btn-sm px-3">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Đăng xuất
            </a>
        </div>

    </div>
</nav>

<div class="container mt-5">
    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📄 Danh sách tin tức</h3>
        <a th:href="@{/admin/news/new}" class="btn btn-primary">
            <i class="fa fa-plus"></i> Thêm tin tức
        </a>
    </div>

    <!-- Thông báo -->
    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

    <!-- TABLE -->
    <table class="table table-bordered align-middle">
        <thead class="table-light text-center">
        <tr>
            <th width="70">ID</th>
            <th width="120">Thumbnail</th>
            <th>Tiêu đề</th>
            <th>Slug</th>
            <th width="260">Tóm tắt</th>
            <th width="120">Trạng thái</th>
            <th width="160">Ngày tạo</th>
            <th style="width:150px;">Hành động</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="n : ${list}">
            <td th:text="${n.id}"></td>

            <td class="text-center">
                <img th:src="${n.thumbnail}" style="width: 90px; border-radius: 6px;">
            </td>

            <td th:text="${n.title}"></td>
            <td th:text="${n.slug}"></td>

            <!-- SUMMARY -->
            <td th:text="${n.summary != null ? (n.summary.length() > 60 ? n.summary.substring(0, 60) + '…' : n.summary) : ''}">
            </td>

            <td class="text-center">
                <span th:if="${n.active}" class="badge bg-success">Hiển thị</span>
                <span th:unless="${n.active}" class="badge bg-secondary">Ẩn</span>
            </td>

            <td th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}"></td>

            <td class="text-center">
                <a th:href="@{'/admin/news/edit/' + ${n.id}}" class="btn btn-sm btn-warning">
                    <i class="fa fa-edit"></i> Sửa
                </a>

                <a th:href="@{'/admin/news/delete/' + ${n.id}}"
                   onclick="return confirm('Bạn chắc chắn muốn xóa tin này?');"
                   class="btn btn-sm btn-danger mt-1">
                    <i class="fa fa-trash"></i> Xóa
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(list)}">
            <td colspan="8" class="text-center text-muted py-3">
                Không có tin tức nào.
            </td>
        </tr>
        </tbody>
    </table>


</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
<script>
    // Tự động highlight menu đúng theo URL hiện tại
    document.querySelectorAll('.nav-admin').forEach(item => {
        if (window.location.pathname.startsWith(item.getAttribute('href'))) {
            item.classList.add('active');
        }
    });
</script>
</html>
