<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Chỉnh sửa tin tức' : 'Thêm tin tức mới'"></title>

    <!-- Bootstrap CSS (CDN) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container mt-5">
    <a href="/admin/news" class="btn btn-outline-secondary mb-3">
        <i class="fa fa-arrow-left"></i> Quay lại danh sách tin tức
    </a>

    <div class="card shadow-sm">

        <!-- Header -->
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" th:text="${isEdit} ? 'Chỉnh sửa tin tức' : 'Thêm tin tức mới'"></h5>
        </div>

        <div class="card-body">

            <form th:action="@{/admin/news/save}" th:object="${news}"
                  method="post" enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">

                <!-- Tiêu đề -->
                <div class="mb-3">
                    <label class="form-label">Tiêu đề bài viết</label>
                    <input type="text" class="form-control" th:field="*{title}" required>
                </div>

                <!-- Summary -->
                <div class="mb-3">
                    <label class="form-label">Tóm tắt bài viết (Summary)</label>
                    <textarea class="form-control" th:field="*{summary}"
                              rows="3" placeholder="Nhập mô tả ngắn..." required></textarea>
                </div>

                <!-- Thumbnail -->
                <div class="mb-3">
                    <label class="form-label">Ảnh Thumbnail</label>

                    <!-- IMPORTANT: thêm id để JS preview hoạt động -->
                    <input type="file" id="thumbnailInput"
                           class="form-control"
                           th:field="*{thumbnailFile}" accept="image/*">

                    <!-- Preview ảnh -->
                    <img id="thumbnailPreview"
                         th:if="*{thumbnail}"
                         th:src="*{thumbnail}"
                         class="mt-2"
                         style="max-height:120px;border-radius:6px;display:block;">

                    <img id="thumbnailPreview"
                         th:if="*{thumbnail == null}"
                         class="mt-2"
                         style="max-height:120px;border-radius:6px;display:none;">
                </div>

                <!-- Content -->
                <div class="mb-3">
                    <label class="form-label">Nội dung</label>
                    <textarea id="contentArea" th:field="*{content}" rows="12"></textarea>
                </div>

                <!-- Active -->
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label">Hiển thị</label>
                </div>

                <!-- Buttons -->
                <div class="text-end">
                    <a th:href="@{/admin/news}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-success">
                        <i class="fa fa-save"></i>
                        <span th:text="${isEdit} ? 'Cập nhật' : 'Lưu mới'"></span>
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS from CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Preview Thumbnail -->
<script>
    const thumbInput = document.getElementById("thumbnailInput");
    const thumbPreview = document.getElementById("thumbnailPreview");

    if (thumbInput && thumbPreview) {
        thumbInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();

                reader.onload = e => {
                    thumbPreview.src = e.target.result;
                    thumbPreview.style.display = "block";
                };

                reader.readAsDataURL(file);
            }
        });
    }
</script>

<script src="https://cdn.ckeditor.com/4.22.1/full-all/ckeditor.js"></script>

<script>
    CKEDITOR.replace('contentArea', {
        language: 'vi',
        height: 350,
        allowedContent: true,

        extraPlugins: 'colorbutton,colordialog,font,justify,image2,uploadimage,autogrow',

        /* FIX conflict & PDF warning */
        removePlugins: 'exportpdf,image',

        toolbar: [
            { name: 'document', items: ['Source', '-', 'Preview', 'Print'] },
            { name: 'clipboard', items: ['Undo', 'Redo'] },
            { name: 'styles', items: ['Format', 'Font', 'FontSize'] },
            { name: 'colors', items: ['TextColor', 'BGColor'] },
            '/',
            { name: 'basicstyles', items: ['Bold', 'Italic', 'Underline', 'Strike'] },
            { name: 'paragraph', items: [
                    'NumberedList', 'BulletedList', '-',
                    'JustifyLeft', 'JustifyCenter', 'JustifyRight', 'JustifyBlock'
                ] },
            { name: 'insert', items: ['Image', 'Table', 'HorizontalRule', 'SpecialChar'] },
            { name: 'links', items: ['Link', 'Unlink'] },
            { name: 'tools', items: ['Maximize'] }
        ],

        autoGrow_maxHeight: 700,
        autoGrow_minHeight: 250,
    });
</script>


</body>
</html>
