<style>
    /* phân biệt nhập / xuất */
    .row-import {
        background-color: #f0fdf4; /* xanh rất nhạt */
    }

    .row-export {
        background-color: #fef2f2; /* đỏ rất nhạt */
    }

    /* hover vẫn rõ */
    .report-table tbody tr:hover {
        background-color: #eef2ff !important;
    }
    .card-soft {
        border-radius: 14px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .report-table th,
    .report-table td {
        vertical-align: middle;
        text-align: center;
    }
    .report-table td.product {
        text-align: left;
        font-weight: 500;
    }
</style>
<div>

    <!-- HEADER -->
    <div class="mb-4">
        <h3 class="fw-bold mb-1">📊 Báo cáo nhập / xuất kho</h3>
        <div class="text-muted">
            Tổng hợp biến động kho theo khoảng thời gian
        </div>
    </div>

    <!-- FILTER -->
    <form method="get" class="card-soft bg-white p-3 mb-4">
        <div class="row g-3 align-items-end">

            <div class="col-md-3">
                <label class="form-label">Từ ngày</label>
                <input type="date" name="from"
                       class="form-control form-control-sm"
                       th:value="${from}">
            </div>

            <div class="col-md-3">
                <label class="form-label">Đến ngày</label>
                <input type="date" name="to"
                       class="form-control form-control-sm"
                       th:value="${to}">
            </div>

            <div class="col-md-3">
                <button class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-bar-chart"></i> Xem báo cáo
                </button>
            </div>

            <div class="col-md-3">
                <a href="/admin/inventory/report"
                   class="btn btn-sm btn-outline-secondary w-100">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </a>
            </div>

        </div>
    </form>

    <!-- SUMMARY -->
    <div class="row g-3 mb-4">

        <div class="col-md-3">
            <div class="card-soft bg-white p-3 border-start border-success border-3">
                <div class="text-muted small">Tổng nhập</div>
                <div class="fs-4 fw-bold text-success"
                     th:text="${totalImport}">
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-soft bg-white p-3 border-start border-danger border-3">
                <div class="text-muted small">Tổng xuất</div>
                <div class="fs-4 fw-bold text-danger"
                     th:text="${totalExport}">
                </div>
            </div>
        </div>

    </div>

    <!-- TABLE -->
    <div class="card-soft bg-white p-3">

        <table class="table table-sm table-hover report-table mb-0">
            <thead class="table-light">
            <tr>
                <th>Thời gian</th>
                <th>Loại</th>
                <th>Sản phẩm</th>
                <th>Số lượng</th>
                <th>Tồn trước</th>
                <th>Tồn sau</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="m : ${movements}"
                th:classappend="
        ${m.actionType.name() == 'IMPORT'} ? 'row-import' :
        (${m.actionType.name() == 'EXPORT'} ? 'row-export' : '')
    ">

                <td th:text="${#temporals.format(m.actionDate,'dd/MM/yyyy HH:mm')}"></td>

                <td>
                    <span th:if="${m.actionType.name() == 'IMPORT'}"
                          class="badge bg-success-subtle text-success">
                        Nhập
                    </span>
                    <span th:if="${m.actionType.name() == 'EXPORT'}"
                          class="badge bg-danger-subtle text-danger">
                        Xuất
                    </span>
                </td>

                <td class="product" th:text="${m.product.name}"></td>

                <td>
                    <span th:if="${m.actionType.name() == 'IMPORT'}"
                          class="fw-bold text-success">
                        +[[${m.quantityChange}]]
                    </span>
                    <span th:if="${m.actionType.name() == 'EXPORT'}"
                          class="fw-bold text-danger">
                        [[${m.quantityChange}]]
                    </span>
                </td>

                <td th:text="${m.stockBefore}"></td>
                <td class="fw-bold" th:text="${m.stockAfter}"></td>
            </tr>

            <tr th:if="${movements.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4">
                    Không có dữ liệu trong khoảng thời gian này
                </td>
            </tr>
            </tbody>
        </table>

    </div>

    <!-- BACK -->
    <div class="mt-3">
        <a href="/admin/inventory/stocks"
           class="btn btn-sm btn-outline-secondary">
            ⬅ Quay lại tồn kho
        </a>
    </div>

</div>
