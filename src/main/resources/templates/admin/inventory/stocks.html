<div>

    <!-- ================= STYLE ================= -->
    <style>
        .stock-card {
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,.08);
            transition: transform .15s ease, box-shadow .15s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .stock-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(0,0,0,.12);
        }

        /* ===== HEADER CARD ===== */
        .card-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            min-height: 68px; /* cố định chiều cao */
        }

        .product-name {
            font-size: 17px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.35;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-meta {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .status-pill {
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ===== BODY ===== */
        .card-body-custom {
            text-align: center;
            padding: 28px 0 24px;
            flex-grow: 1;
        }

        .quantity-box {
            font-size: 36px;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
        }

        .quantity-label {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: .5px;
            margin-top: 6px;
        }

        /* ===== ACTION ===== */
        .action-btn {
            height: 44px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
        }
    </style>

    <!-- ================= HEADER ================= -->
    <div class="mb-4">
        <h2 class="fw-bold mb-1">📦 Quản lý tồn kho</h2>
        <div class="text-muted fs-6">
            Theo dõi số lượng & trạng thái từng sản phẩm
        </div>
    </div>

    <!-- ================= SEARCH ================= -->
    <div class="bg-white rounded-4 p-3 mb-4"
         style="box-shadow:0 4px 12px rgba(0,0,0,.06)">
        <form class="row g-2 align-items-center" method="get">
            <div class="col-md-4">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       class="form-control form-control-lg"
                       placeholder="🔍 Nhập tên sản phẩm">
            </div>
            <div class="col-auto">
                <button class="btn btn-lg btn-primary px-4">Tìm</button>
            </div>
            <div class="col-auto">
                <a href="/admin/inventory/stocks"
                   class="btn btn-lg btn-outline-secondary px-4">Reset</a>
            </div>
        </form>
    </div>

    <!-- ================= CARD LIST ================= -->
    <div class="row g-4">

        <div class="col-xl-3 col-lg-4 col-md-6"
             th:each="s : ${stocks}">

            <div class="stock-card p-4">

                <!-- HEADER -->
                <div class="card-header-custom mb-3">
                    <div>
                        <div class="product-name"
                             th:text="${s.product.name}"></div>
                        <div class="product-meta">
                            Mã kho: [[${s.id}]]
                        </div>
                    </div>

                    <span th:if="${s.quantity <= 2}"
                          class="status-pill bg-danger-subtle text-danger">
                        Ít
                    </span>

                    <span th:if="${s.quantity > 2 && s.quantity <= 5}"
                          class="status-pill bg-warning-subtle text-warning">
                        Trung bình
                    </span>

                    <span th:if="${s.quantity > 5}"
                          class="status-pill bg-success-subtle text-success">
                        Tốt
                    </span>
                </div>

                <!-- BODY -->
                <div class="card-body-custom">
                    <div class="quantity-box">
                        [[${s.quantity}]]
                    </div>
                    <div class="quantity-label">
                        SẢN PHẨM TRONG KHO
                    </div>
                </div>

                <!-- ACTION -->
                <div class="d-grid gap-2">
                    <a href="/admin/inventory/import"
                       class="btn btn-success action-btn">
                        ➕ Nhập kho
                    </a>

                    <a href="/admin/inventory/export"
                       class="btn btn-outline-danger action-btn">
                        ➖ Xuất kho
                    </a>
                </div>

            </div>
        </div>

        <!-- EMPTY -->
        <div th:if="${stocks.isEmpty()}" class="col-12">
            <div class="text-center text-muted py-5 fs-5">
                📭 Không có dữ liệu tồn kho
            </div>
        </div>

    </div>

</div>
