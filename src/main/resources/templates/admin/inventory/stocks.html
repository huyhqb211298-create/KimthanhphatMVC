<div>

    <style>
        .stock-badge {
            min-width: 42px;
            font-weight: 600;
        }
        .table-hover tbody tr:hover {
            background: #f8fafc;
        }
    </style>

    <!-- HEADER -->
    <div class="mb-4">
        <h3 class="fw-bold mb-1">📦 Tồn kho hiện tại</h3>
        <div class="text-muted">
            Danh sách sản phẩm đang có trong kho
        </div>
    </div>

    <!-- MINI KPI -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="p-3 bg-white rounded-3 border-start border-primary border-3"
                 style="box-shadow:0 1px 2px rgba(0,0,0,.04)">
                <div class="text-muted small">Sản phẩm</div>
                <div class="fs-4 fw-bold" th:text="${stocks.size()}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="p-3 bg-white rounded-3 border-start border-success border-3"
                 style="box-shadow:0 1px 2px rgba(0,0,0,.04)">
                <div class="text-muted small">Tổng số lượng tồn</div>
                <div class="fs-4 fw-bold" th:text="${totalQuantity}"></div>
            </div>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="bg-white rounded-3 p-3 mb-3"
         style="box-shadow:0 1px 3px rgba(0,0,0,.06)">
        <form class="row g-2 align-items-center" method="get">
            <div class="col-md-4">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       class="form-control form-control-sm"
                       placeholder="🔍 Tìm theo tên sản phẩm">
            </div>
            <div class="col-auto">
                <button class="btn btn-sm btn-primary">Tìm kiếm</button>
            </div>
            <div class="col-auto">
                <a href="/admin/inventory/stocks"
                   class="btn btn-sm btn-outline-secondary">Reset</a>
            </div>
        </form>
    </div>

    <!-- TABLE -->
    <div class="bg-white rounded-3"
         style="box-shadow:0 1px 3px rgba(0,0,0,.06)">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Sản phẩm</th>
                <th>Thương hiệu</th>
                <th class="text-center">Số lượng</th>
                <th class="text-center">Trạng thái</th>
                <th class="text-center">Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s, i : ${stocks}">
                <td th:text="${i.count}"></td>
                <td class="fw-medium" th:text="${s.product.name}"></td>
                <td th:text="${s.product.brand != null ? s.product.brand.name : '-'}"></td>

                <td class="text-center">
                    <span class="badge rounded-pill bg-primary-subtle text-primary stock-badge">
                        [[${s.quantity}]]
                    </span>
                </td>

                <td class="text-center">
                    <span th:if="${s.quantity <= 2}" class="badge bg-danger-subtle text-danger">Ít</span>
                    <span th:if="${s.quantity > 2 && s.quantity <= 5}" class="badge bg-warning-subtle text-warning">Trung bình</span>
                    <span th:if="${s.quantity > 5}" class="badge bg-success-subtle text-success">Tốt</span>
                </td>

                <td class="text-center">
                    <a href="/admin/inventory/import"
                       class="btn btn-sm btn-outline-success me-1">
                        <i class="bi bi-plus-circle"></i>
                    </a>
                    <a href="/admin/inventory/export"
                       class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-dash-circle"></i>
                    </a>
                </td>
            </tr>

            <tr th:if="${stocks.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4">
                    Không có dữ liệu tồn kho
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
