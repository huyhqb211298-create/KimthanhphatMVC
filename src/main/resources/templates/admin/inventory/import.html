<div>

    <style>
        .card-soft {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 1px 3px rgba(0,0,0,.06);
        }

        .import-table td,
        .import-table th {
            vertical-align: middle !important;
        }

        .import-table select,
        .import-table input,
        .import-table button {
            height: 36px;
        }

        .import-table input[type="number"] {
            padding: 4px 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .import-table .form-control:focus,
        .import-table .form-select:focus {
            box-shadow: none;
        }
    </style>

    <!-- HEADER -->
    <div class="mb-4">
        <h3 class="fw-bold mb-1">📥 Nhập kho</h3>
        <div class="text-muted">
            Lập phiếu nhập kho sản phẩm
        </div>
    </div>

    <!-- SUCCESS -->
    <div th:if="${param.success}"
         class="alert alert-success">
        ✅ Nhập kho thành công!
    </div>

    <form th:action="@{/admin/inventory/import}"
          th:object="${inventoryImport}"
          method="post">

        <!-- INFO -->
        <div class="card-soft bg-white p-3 mb-4">
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Người nhập</label>
                    <input type="text"
                           th:field="*{createdBy}"
                           class="form-control"
                           placeholder="admin"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ghi chú</label>
                    <input type="text"
                           th:field="*{note}"
                           class="form-control"
                           placeholder="Nhập lô / bổ sung kho...">
                </div>

            </div>
        </div>

        <!-- ITEMS -->
        <div class="card-soft bg-white p-3 mb-4">

            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="fw-semibold">
                    📦 Danh sách sản phẩm nhập
                </div>
                <button type="button"
                        class="btn btn-sm btn-outline-primary"
                        onclick="addRow()">
                    <i class="bi bi-plus-circle"></i> Thêm dòng
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0 import-table">
                    <thead class="table-light">
                    <tr>
                        <th>Sản phẩm</th>
                        <th class="text-center" style="width:120px">Số lượng</th>
                        <th class="text-center" style="width:160px">
                            Giá nhập
                            <span class="text-muted small">(tuỳ chọn)</span>
                        </th>
                        <th class="text-center" style="width:100px">Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="itemsBody"></tbody>
                </table>
            </div>

        </div>

        <!-- ACTION -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-box-arrow-in-down"></i> Lưu phiếu nhập
            </button>
            <a href="/admin/inventory"
               class="btn btn-outline-secondary">
                Quay lại
            </a>
        </div>

    </form>

    <!-- SCRIPT -->
    <script th:inline="javascript">
        const products = /*[[${products}]]*/ [];
        let rowIndex = 0;

        function productOptionsHtml() {
            return products
                .map(p => `<option value="${p.id}">${p.name}</option>`)
                .join("");
        }

        function addRow() {
            const tbody = document.getElementById("itemsBody");
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>
                    <select name="items[${rowIndex}].product.id"
                            class="form-select form-select-sm"
                            required>
                        <option value="">-- Chọn sản phẩm --</option>
                        ${productOptionsHtml()}
                    </select>
                </td>

                <td class="text-center">
                    <input type="number"
                           name="items[${rowIndex}].quantity"
                           class="form-control form-control-sm text-center"
                           min="1"
                           required>
                </td>

                <td class="text-center">
                    <input type="number"
                           name="items[${rowIndex}].importPrice"
                           class="form-control form-control-sm text-center"
                           min="0"
                           step="0.01"
                           placeholder="-">
                </td>

                <td class="text-center">
                    <button type="button"
                            class="btn btn-sm btn-outline-danger btn-icon"
                            onclick="removeRow(this)">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
            rowIndex++;
        }

        function removeRow(btn) {
            btn.closest("tr").remove();
        }

        // mặc định 1 dòng
        addRow();
    </script>

</div>
