<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/admin">Admin Dashboard</a>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-outline-light btn-sm">Đăng xuất</button>
    </form>
</nav>

<div class="container">
    <h2 class="mb-4 text-center">Trang Quản Trị</h2>

    <div class="row justify-content-center">

        <div class="col-md-4">
            <a href="/admin/products" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center">
                    <h4>📦 Quản lý Sản phẩm</h4>
                    <p class="text-muted">Thêm, sửa, xóa sản phẩm</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/admin/news" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center">
                    <h4>📰 Quản lý Bài viết</h4>
                    <p class="text-muted">Thêm, sửa, xóa bài viết</p>
                </div>
            </a>
        </div>

    </div>
</div>

</body>
</html>
