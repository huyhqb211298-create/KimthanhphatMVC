<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu liên hệ | Quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#f5f7fb; }
        .admin-nav { background:linear-gradient(90deg,#1f1f1f,#2c2c2c); }
        .contact-message { min-width:260px; max-width:420px; white-space:pre-wrap; word-break:break-word; }
        .contact-table th { white-space:nowrap; }
        .contact-table td { vertical-align:top; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark admin-nav px-4 py-3 shadow-sm">
    <a class="navbar-brand fw-bold" th:href="@{/admin}">
        <i class="fa-solid fa-shield-halved me-2 text-warning"></i>Quản trị hệ thống
    </a>
    <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" th:href="@{/admin}">Trang quản trị</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger btn-sm" type="submit">Đăng xuất</button>
        </form>
    </div>
</nav>

<main class="container-fluid px-3 px-lg-4 py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Yêu cầu liên hệ</h1>
            <p class="text-muted mb-0">Thông tin khách gửi từ biểu mẫu Contact.</p>
        </div>
        <form method="get" th:action="@{/admin/contacts}" class="d-flex gap-2">
            <select name="status" class="form-select" aria-label="Lọc theo trạng thái">
                <option value="">Tất cả trạng thái</option>
                <option th:each="item : ${statuses}"
                        th:value="${item}"
                        th:text="${item.displayName}"
                        th:selected="${item == selectedStatus}"></option>
            </select>
            <button class="btn btn-primary" type="submit">Lọc</button>
        </form>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover contact-table mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã / Thời gian</th>
                    <th>Khách hàng</th>
                    <th>Chủ đề và nội dung</th>
                    <th>Email thông báo</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contact : ${contactPage.content}">
                    <td>
                        <div class="fw-bold" th:text="' #' + ${contact.id}">#1</div>
                        <small class="text-muted"
                               th:text="${#temporals.format(contact.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${contact.name}"></div>
                        <a th:href="'tel:' + ${contact.phone}" th:text="${contact.phone}"></a>
                        <br>
                        <a th:href="'mailto:' + ${contact.email}" th:text="${contact.email}"></a>
                    </td>
                    <td>
                        <div class="fw-semibold mb-1"
                             th:text="${contact.subject != null && !contact.subject.isBlank() ? contact.subject : 'Không có chủ đề'}"></div>
                        <div class="contact-message text-muted" th:text="${contact.message}"></div>
                    </td>
                    <td>
                        <span th:if="${contact.emailNotificationSent}" class="badge text-bg-success">Đã gửi</span>
                        <span th:unless="${contact.emailNotificationSent}" class="badge text-bg-secondary">Chưa gửi</span>
                        <div th:if="${contact.notificationError != null}"
                             class="small text-muted mt-1" th:text="${contact.notificationError}"></div>
                    </td>
                    <td style="min-width:220px">
                        <div class="mb-2">
                            <span th:if="${contact.status.name() == 'NEW'}" class="badge text-bg-danger">Mới</span>
                            <span th:if="${contact.status.name() == 'CONTACTED'}" class="badge text-bg-warning">Đã liên hệ</span>
                            <span th:if="${contact.status.name() == 'COMPLETED'}" class="badge text-bg-success">Hoàn thành</span>
                        </div>
                        <form method="post" th:action="@{/admin/contacts/{id}/status(id=${contact.id})}"
                              class="d-flex gap-2">
                            <select name="status" class="form-select form-select-sm" aria-label="Cập nhật trạng thái">
                                <option th:each="item : ${statuses}"
                                        th:value="${item}"
                                        th:text="${item.displayName}"
                                        th:selected="${item == contact.status}"></option>
                            </select>
                            <button class="btn btn-outline-primary btn-sm" type="submit">Lưu</button>
                        </form>
                        <form method="post" th:action="@{/admin/contacts/{id}/delete(id=${contact.id})}"
                              class="mt-2"
                              onsubmit="return confirm('Xóa vĩnh viễn yêu cầu liên hệ này? Thao tác không thể hoàn tác.');">
                            <button class="btn btn-outline-danger btn-sm" type="submit">
                                <i class="fa-solid fa-trash-can me-1"></i>Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${contactPage.empty}">
                    <td colspan="5" class="text-center text-muted py-5">Chưa có yêu cầu liên hệ nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:if="${contactPage.totalPages > 1}" class="mt-4" aria-label="Phân trang">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${contactPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/contacts(page=${contactPage.number - 1},status=${selectedStatus})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Trang ' + ${contactPage.number + 1} + ' / ' + ${contactPage.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${contactPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/contacts(page=${contactPage.number + 1},status=${selectedStatus})}">Sau</a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
