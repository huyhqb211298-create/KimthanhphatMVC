<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Hồ sơ năng lực - Kim Thành Phát PCCC</title>
    <meta name="description" content="Xem hồ sơ năng lực của Kim Thành Phát trong lĩnh vực cung cấp thiết bị và giải pháp phòng cháy chữa cháy.">
    <link rel="canonical" href="https://kimthanhphatpccc.vn/hsnl">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --hsnl-red: #d93412;
            --hsnl-ink: #102033;
            --hsnl-paper: #f4f1eb;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; min-height: 100%; }

        body {
            background: var(--hsnl-paper);
            color: var(--hsnl-ink);
            font-family: "Be Vietnam Pro", sans-serif;
        }

        .document-toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            min-height: 76px;
            padding: 14px clamp(16px, 4vw, 56px);
            background: #fff;
            border-bottom: 1px solid rgba(16, 32, 51, .12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .document-heading {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .back-link {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--hsnl-ink);
            background: #f5f5f5;
            text-decoration: none;
        }

        .document-title { margin: 0; font-size: clamp(16px, 2vw, 22px); font-weight: 800; }
        .document-note { margin: 2px 0 0; color: #647080; font-size: 13px; }

        .document-actions { display: flex; gap: 10px; }

        .document-action {
            min-height: 42px;
            padding: 0 17px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            background: var(--hsnl-red);
            font-weight: 700;
            text-decoration: none;
        }

        .document-action-secondary { color: var(--hsnl-ink); background: #eef0f2; }

        .document-viewer {
            padding: clamp(18px, 3vw, 42px);
            display: grid;
            justify-items: center;
            gap: clamp(16px, 2.4vw, 30px);
            background: #252525;
        }

        .document-page {
            position: relative;
            width: min(100%, 1280px);
            margin: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .28);
        }

        .document-page img {
            display: block;
            width: 100%;
            height: auto;
        }

        .document-page figcaption {
            position: absolute;
            right: 12px;
            bottom: 12px;
            min-width: 34px;
            height: 34px;
            padding: 0 9px;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: rgba(16, 32, 51, .78);
            font-size: 12px;
            font-weight: 700;
        }

        @media (max-width: 767px) {
            .document-toolbar { align-items: flex-start; padding: 12px 14px; }
            .document-note, .document-action span { display: none; }
            .document-action { width: 42px; padding: 0; }
            .document-viewer { padding: 12px 8px; gap: 12px; }
            .document-page { border-radius: 4px; }
            .document-page figcaption { right: 7px; bottom: 7px; }
        }
    </style>
</head>

<body>
<header class="document-toolbar">
    <div class="document-heading">
        <a th:href="@{/about}" class="back-link" aria-label="Quay lại trang Giới thiệu">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
        <div>
            <h1 class="document-title">Hồ sơ năng lực Kim Thành Phát</h1>
            <p class="document-note">Tài liệu giới thiệu năng lực và lĩnh vực hoạt động</p>
        </div>
    </div>
    <nav class="document-actions" aria-label="Thao tác với tài liệu">
        <a th:href="@{/files/hoso-nang-luc-kim-thanh-phat.pdf}" target="_blank" rel="noopener"
           class="document-action document-action-secondary">
            <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i><span>Mở riêng</span>
        </a>
        <a th:href="@{/files/hoso-nang-luc-kim-thanh-phat.pdf}" download class="document-action">
            <i class="fa-solid fa-download" aria-hidden="true"></i><span>Tải PDF</span>
        </a>
    </nav>
</header>

<main class="document-viewer" aria-label="Nội dung hồ sơ năng lực Kim Thành Phát">
    <figure class="document-page">
        <img th:src="@{/img/hsnl/hoso-nang-luc-1.webp}" alt="Bìa hồ sơ năng lực Kim Thành Phát" width="2400" height="1350">
        <figcaption>1 / 6</figcaption>
    </figure>
    <figure class="document-page">
        <img th:src="@{/img/hsnl/hoso-nang-luc-2.jpg}" alt="Giới thiệu Công ty Kim Thành Phát" width="2400" height="1350" loading="lazy">
        <figcaption>2 / 6</figcaption>
    </figure>
    <figure class="document-page">
        <img th:src="@{/img/hsnl/hoso-nang-luc-3.jpg}" alt="Thiết bị PCCC và dịch vụ hỗ trợ" width="2400" height="1350" loading="lazy">
        <figcaption>3 / 6</figcaption>
    </figure>
    <figure class="document-page">
        <img th:src="@{/img/hsnl/hoso-nang-luc-4.webp}" alt="Khách hàng, đối tác và thương hiệu phân phối" width="2400" height="1350" loading="lazy">
        <figcaption>4 / 6</figcaption>
    </figure>
    <figure class="document-page">
        <img th:src="@{/img/hsnl/hoso-nang-luc-5.jpg}" alt="Các dự án PCCC đã tham gia" width="2400" height="1350" loading="lazy">
        <figcaption>5 / 6</figcaption>
    </figure>
    <figure class="document-page">
        <img th:src="@{/img/hsnl/hoso-nang-luc-6.webp}" alt="Cam kết và thông tin liên hệ Kim Thành Phát" width="2400" height="1350" loading="lazy">
        <figcaption>6 / 6</figcaption>
    </figure>
</main>

</body>
</html>
