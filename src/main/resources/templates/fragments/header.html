<header th:fragment="siteHeader">

    <!-- TOP BAR -->
    <div class="topbar py-1">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="info d-flex align-items-center gap-4 small">
                <span><i class="fa fa-envelope me-1"></i> info@kimthanhphatpccc.vn</span>
                <span><i class="fa fa-phone-alt me-1"></i> Zalo / Hotline: 0934.752.114</span>
                <span><i class="fa fa-clock me-1"></i> 08:00 - 17:30 (T2 - T6)</span>
            </div>

            <div class="social d-flex gap-3">
                <a href="https://www.facebook.com/profile.php?id=61581028044022"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.youtube.com"><i class="fab fa-youtube"></i></a>
                <a href="https://www.instagram.com/pccckimthanhphat"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="site-navbar shadow-sm">
        <div class="container d-flex align-items-center justify-content-between">

            <!-- LOGO -->
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <div class="logo-box">
                    <img th:src="@{/img/logo.png}" alt="Kim Thành Phát">
                </div>
            </a>

            <!-- MENU DESKTOP -->
            <ul class="main-menu d-none d-lg-flex align-items-center gap-3 mb-0">
                <li><a th:href="@{/}">TRANG CHỦ</a></li>
                <li><a th:href="@{/about}">GIỚI THIỆU</a></li>
                <li><a th:href="@{/consulting}">TƯ VẤN</a></li>
                <li><a th:href="@{/news}">TIN TỨC</a></li>
                <li><a th:href="@{/documents}">VĂN BẢN</a></li>

                <!-- MEGA MENU -->
                <li class="mega-dropdown">
                    <a class="dropdown-toggle" th:href="@{/products}">SẢN PHẨM</a>

                    <div class="mega-menu">

                        <!-- DANH MỤC -->
                        <div class="mega-col">
                            <h6>DANH MỤC</h6>
                            <a th:each="c : ${categories}"
                               th:text="${c.name}"
                               th:href="@{'/' + ${c.slug}}"></a>
                        </div>

                        <!-- THƯƠNG HIỆU -->
                        <div class="mega-col">
                            <h6>THƯƠNG HIỆU</h6>

                            <!-- 5 mục đầu -->
                            <a th:each="b, iStat : ${brandList}"
                               th:if="${iStat.index < 5}"
                               th:text="${b.name}"
                               th:href="@{'/' + ${b.slug}}"></a>

                            <!-- Các mục còn lại (ẩn) -->
                            <a class="brand-extra d-none"
                               th:each="b, iStat : ${brandList}"
                               th:if="${iStat.index >= 5}"
                               th:text="${b.name}"
                               th:href="@{'/' + ${b.slug}}"></a>

                            <!-- nút xem thêm -->
                            <button type="button" class="see-more-btn" id="btnBrand">
                                Xem thêm ▼
                            </button>
                        </div>

                        <!-- LOẠI SẢN PHẨM -->
                        <div class="mega-col">
                            <h6>LOẠI SẢN PHẨM</h6>

                            <!-- 5 mục đầu -->
                            <a th:each="t, iStat : ${productTypeList}"
                               th:if="${iStat.index < 5}"
                               th:text="${t.name}"
                               th:href="@{'/' + ${t.slug}}"></a>

                            <!-- các mục còn lại -->
                            <a class="type-extra d-none"
                               th:each="t, iStat : ${productTypeList}"
                               th:if="${iStat.index >= 5}"
                               th:text="${t.name}"
                               th:href="@{'/' + ${t.slug}}"></a>

                            <button type="button" class="see-more-btn" id="btnType">
                                Xem thêm ▼
                            </button>
                        </div>

                    </div>
                </li>
            </ul>

            <!-- SEARCH + CALL -->
            <div class="actions d-flex align-items-center gap-3">

                <form class="search-inline d-none d-lg-flex" th:action="@{/products}" method="get">
                    <input type="text" name="keyword" placeholder="Tìm kiếm...">
                    <button><i class="fa fa-search"></i></button>
                </form>

                <a href="https://zalo.me/0934752114" class="call-btn d-none d-lg-flex">
                    GỌI NGAY <i class="fa fa-phone"></i>
                </a>


                <!-- MOBILE TOGGLER -->
                <button class="navbar-toggler d-lg-none" type="button"
                        data-bs-toggle="collapse" data-bs-target="#mobileMenu">
                    <i class="fa fa-bars"></i>
                </button>
            </div>

        </div>

        <!-- MOBILE MENU -->
        <div class="collapse" id="mobileMenu">
            <ul class="mobile-nav">
                <li><a th:href="@{/}">Trang chủ</a></li>
                <li><a th:href="@{/about}">Giới thiệu</a></li>
                <li><a th:href="@{/consulting}">Tư vấn</a></li>
                <li><a th:href="@{/templates/admin/news}">Tin tức</a></li>
                <li><a th:href="@{/documents}">Văn bản</a></li>

                <li class="mt-3 fw-bold text-white ps-3">SẢN PHẨM</li>

                <li th:each="c : ${categories}">
                    <a th:text="${c.name}" th:href="@{'/' + ${c.slug}}"></a>
                </li>
                <li th:each="b : ${brandList}">
                    <a th:text="${b.name}" th:href="@{'/' + ${b.slug}}"></a>
                </li>
                <li th:each="t : ${productTypeList}">
                    <a th:text="${t.name}" th:href="@{'/' + ${t.slug}}"></a>
                </li>
            </ul>
        </div>

    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", function() {

            // TOGGLE BRAND
            const btnBrand = document.getElementById("btnBrand");
            const brandExtra = document.querySelectorAll(".brand-extra");

            btnBrand.addEventListener("click", function () {
                brandExtra.forEach(item => item.classList.toggle("d-none"));
                btnBrand.textContent = brandExtra[0].classList.contains("d-none")
                    ? "Xem thêm ▼"
                    : "Thu gọn ▲";
            });

            // TOGGLE PRODUCT TYPE
            const btnType = document.getElementById("btnType");
            const typeExtra = document.querySelectorAll(".type-extra");

            btnType.addEventListener("click", function () {
                typeExtra.forEach(item => item.classList.toggle("d-none"));
                btnType.textContent = typeExtra[0].classList.contains("d-none")
                    ? "Xem thêm ▼"
                    : "Thu gọn ▲";
            });

        });
    </script>

</header>
