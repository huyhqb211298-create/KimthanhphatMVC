<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lỗi máy chủ | Kim Thành Phát</title>

    <!-- BOOTSTRAP + FONT AWESOME -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- CSS CHÍNH -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
</head>

<body>

<!-- HEADER -->
<div th:replace="~{fragments/header :: siteHeader}"></div>

<!-- CONTENT -->
<div class="container text-center py-5 my-5">

    <h1 class="display-1 fw-bold text-warning">500</h1>

    <h2 class="text-uppercase fw-bold mb-3 text-danger">Lỗi hệ thống</h2>

    <p class="text-muted mb-4">
        Có lỗi xảy ra khi xử lý yêu cầu của bạn. Chúng tôi sẽ khắc phục sớm nhất có thể.
    </p>

    <a th:href="@{/}" class="btn btn-danger px-4 py-2 rounded-pill">
        <i class="fa fa-rotate-left me-2"></i>
        Quay lại trang chủ
    </a>

</div>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: siteFooter}"></div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>

</body>
</html>
