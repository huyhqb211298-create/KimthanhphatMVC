<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lỗi hệ thống | Kim Thành Phát</title>
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/support-pages.css}">
</head>
<body class="support-page">
<div th:replace="~{fragments/header :: siteHeader}"></div>
<main class="error-stage">
    <div class="support-shell">
        <section class="error-card">
            <p class="error-code">500</p>
            <h1>Hệ thống đang gián đoạn</h1>
            <p>Yêu cầu của bạn chưa thể xử lý vào lúc này. Vui lòng thử lại sau hoặc liên hệ với Kim Thành Phát nếu bạn cần được hỗ trợ ngay.</p>
            <div class="error-actions">
                <a th:href="@{/}" class="support-button"><i class="fa-solid fa-house"></i> Về trang chủ</a>
                <a th:href="@{/contact}" class="support-button--ghost"><i class="fa-solid fa-headset"></i> Liên hệ hỗ trợ</a>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
